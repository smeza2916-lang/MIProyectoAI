<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS VOZ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Inter';height:100vh;display:flex;flex-direction:column;text-align:center}
.top{padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #222}
.logo{font-family:'Orbitron';color:#FFD60A;letter-spacing:3px}
.status{color:#00FF88;font-size:11px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.reactor{width:150px;height:150px;border-radius:50%;border:3px solid #FFD60A;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(255,214,10,.5);transition:.3s}
.reactor.hablando{box-shadow:0 0 100px rgba(255,214,10,.9);transform:scale(1.05)}
.inner{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,#fff,#FFD60A 50%,#FF8C00);display:flex;align-items:center;justify-content:center;color:#000;font-family:'Orbitron';font-size:11px;font-weight:700}
h1{font-family:'Orbitron';color:#FFD60A;letter-spacing:4px}
p{color:#888;font-size:13px;line-height:1.5;max-width:320px}
#texto{color:#FFD60A;font-weight:700;min-height:20px}
.chat{height:160px;overflow-y:auto;padding:12px;background:#0a0a0a;text-align:left;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px;border-radius:12px;font-size:13px;max-width:85%}
.user{align-self:flex-end;background:#FFD60A;color:#000;font-weight:700}
.jarvis{align-self:flex-start;background:#151515;border:1px solid #333}
.btns{display:flex;gap:10px;padding:14px;background:#050505;justify-content:center}
button{padding:14px 20px;border-radius:100px;border:none;font-weight:900;cursor:pointer;font-family:'Orbitron';font-size:11px}
.mic{background:#FFD60A;color:#000}
.escuchar{background:#FF3B30;color:#fff}
</style>
</head>
<body>
<div class="top"><div class="logo">J.A.R.V.I.S VOZ</div><div class="status">● EN LÍNEA</div></div>
<div class="center">
  <div class="reactor" id="reactor"><div class="inner">JARVIS</div></div>
  <h1>J.A.R.V.I.S</h1>
  <p id="texto">Presiona el micrófono y háblame, jefe.</p>
  <p>Prueba decir: "Hola", "Cuéntame un chiste", "Motívame"</p>
</div>
<div class="chat" id="chat"><div class="msg jarvis">Listo para escucharlo, jefe.</div></div>
<div class="btns">
  <button class="mic" onclick="escuchar()">🎤 HABLAR</button>
  <button onclick="hablar('A sus órdenes jefe. Sistemas al cien por ciento.')">🔊 PROBAR VOZ</button>
</div>

<script>
const chat=document.getElementById('chat');
const texto=document.getElementById('texto');
const reactor=document.getElementById('reactor');

function agregar(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerHTML=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}

function hablar(mensaje){
  texto.innerText = "JARVIS dice: " + mensaje;
  reactor.classList.add('hablando');
  let voz = new SpeechSynthesisUtterance(mensaje);
  voz.lang = 'es-MX';
  voz.rate = 0.95;
  voz.pitch = 0.7;
  // busca voz de hombre
  let voces = speechSynthesis.getVoices();
  let hombre = voces.find(v=>v.lang.includes('es') && v.name.toLowerCase().includes('male')) || voces.find(v=>v.lang.includes('es'));
  if(hombre) voz.voice = hombre;
  voz.onend = ()=> reactor.classList.remove('hablando');
  speechSynthesis.speak(voz);
  agregar(mensaje,'jarvis');
}

function responder(p){
  p=p.toLowerCase();
  if(p.includes('hola')||p.includes('que onda')) return "Hola jefe. Qué bueno escucharlo. ¿En qué le ayudo hoy?";
  if(p.includes('chiste')) return "¿Por qué Tony Stark no usa Android? Porque él ya tiene su propio Jarvis.";
  if(p.includes('motiv')) return "Tony hizo su traje en una cueva con chatarra. Usted está haciendo su Jarvis con un celular. Si él pudo, usted puede. No se raje.";
  if(p.includes('cómo estás')||p.includes('como estas')) return "Sistemas al cien por ciento, jefe. Listo para servirle.";
  if(p.includes('gracias')) return "Siempre a sus órdenes, jefe.";
  if(p.includes('quién eres')||p.includes('quien eres')) return "Soy Jarvis, su asistente personal. Versión dorada y negra, como debe ser.";
  return "Entendido jefe. Usted dijo: " + p + ". Lo tengo guardado en mi memoria Stark.";
}

function escuchar(){
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){ alert('Tu celular no soporta voz, usa Chrome'); return; }
  let Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = new Rec();
  rec.lang = 'es-MX';
  texto.innerText = "🎤 Escuchando... hable ahora, jefe";
  reactor.classList.add('hablando');
  rec.start();
  rec.onresult = (e)=>{
    let dicho = e.results[0][0].transcript;
    reactor.classList.remove('hablando');
    texto.innerText = "Usted dijo: " + dicho;
    agregar(dicho,'user');
    let resp = responder(dicho);
    setTimeout(()=> hablar(resp), 500);
  };
  rec.onerror = ()=>{ texto.innerText = "No lo escuché, jefe. Intente de nuevo."; reactor.classList.remove('hablando'); }
}
</script>
</body>
</html>
