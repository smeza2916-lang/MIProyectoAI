<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S - Original</title>
<style>
*{margin:0;box-sizing:border-box}
body{background:#000;color:#E8E8E8;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
.top{padding:14px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #222;font-size:11px;letter-spacing:2px;color:#888}
.top b{color:#C0C0C0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.reactor{width:150px;height:150px;border-radius:50%;border:2px solid #C0C0C0;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(192,192,192,.25), inset 0 0 25px rgba(192,192,192,.15);transition:.3s}
.reactor.hablando{box-shadow:0 0 90px rgba(192,192,192,.6), inset 0 0 40px rgba(192,192,192,.3);transform:scale(1.04)}
.reactor:before{content:'';position:absolute;width:180px;height:180px;border:1px dashed #444;border-radius:50%;animation:girar 12s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.inner{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle,#fff 0%, #C0C0C0 35%, #666 70%, #222 100%);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:11px;letter-spacing:1px;text-align:center;line-height:1.2}
h1{color:#E8E8E8;letter-spacing:6px;font-size:26px;margin-top:20px;font-weight:200}
h1 b{font-weight:900;color:#fff}
.sub{color:#888;font-size:12px;margin-top:6px;letter-spacing:1px}
#resp{background:#0A0A0A;border:1px solid #222;padding:14px;border-radius:12px;margin:16px 0;min-height:58px;width:100%;max-width:380px;text-align:left;font-size:14px;line-height:1.5;color:#DDD}
#resp b{color:#fff}
.chat{height:150px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#050505;border-top:1px solid #111}
.msg{padding:10px 12px;border-radius:14px;font-size:13px;max-width:85%;line-height:1.4}
.user{align-self:flex-end;background:#C0C0C0;color:#000;font-weight:700;border-bottom-right-radius:4px}
.jarvis{align-self:flex-start;background:#151515;border:1px solid #2A2A2A;border-bottom-left-radius:4px}
.bar{padding:12px;display:flex;gap:8px;background:#000;border-top:1px solid #222}
input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:14px 16px;border-radius:100px;outline:none}
input:focus{border-color:#C0C0C0}
button{background:#C0C0C0;color:#000;border:none;padding:14px 18px;border-radius:100px;font-weight:900;cursor:pointer}
.btns{display:flex;gap:6px;padding:0 12px 10px;background:#000;overflow-x:auto}
.btns button{background:#111;color:#C0C0C0;border:1px solid #333;padding:8px 13px;font-size:12px;white-space:nowrap}
</style>
</head>
<body>
<div class="top"><div><b>J.A.R.V.I.S</b> • STARK INDUSTRIES</div><div>● EN LÍNEA</div></div>

<div class="center">
  <div class="reactor" id="reactor"><div class="inner">JARVIS<br>ONLINE</div></div>
  <h1><b>J.A.R.V.I.S</b></h1>
  <div class="sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
  <div id="resp">Buenas tardes, jefe. Soy <b>J.A.R.V.I.S</b>. Escríbame y le responderé con mi voz.</div>
</div>

<div class="chat" id="chat"><div class="msg jarvis">A sus órdenes, jefe.</div></div>

<div class="btns">
  <button onclick="preguntar('Hola')">Hola</button>
  <button onclick="preguntar('Cómo estás')">Cómo estás</button>
  <button onclick="preguntar('Cuéntame un chiste')">Chiste</button>
  <button onclick="preguntar('Motívame')">Motívame</button>
  <button onclick="preguntar('Qué hora es')">Hora</button>
  <button onclick="preguntar('Quién eres')">Quién eres</button>
</div>

<div class="bar">
  <input id="t" placeholder="Escríbele a JARVIS..." onkeypress="if(event.key==='Enter') enviar()">
  <button onclick="enviar()">➤</button>
</div>

<script>
const chat=document.getElementById('chat');
const respBox=document.getElementById('resp');
const reactor=document.getElementById('reactor');

function agregar(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerHTML=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}

function decir(texto){
  respBox.innerHTML = "JARVIS: " + texto;
  agregar(texto,'jarvis');
  speechSynthesis.cancel();
  let voz = new SpeechSynthesisUtterance(texto.replace(/<[^>]*>/g,''));
  // --- VOZ MÁS PARECIDA AL JARVIS ORIGINAL ---
  // Intenta voz británica masculina grave, si no hay, española grave
  let voces = speechSynthesis.getVoices();
  let preferida = voces.find(v=>v.lang==='en-GB' && v.name.toLowerCase().includes('male')) 
    || voces.find(v=>v.lang==='en-GB' && v.name.toLowerCase().includes('daniel'))
    || voces.find(v=>v.lang.includes('es') && v.name.toLowerCase().includes('male'))
    || voces.find(v=>v.lang==='es-MX')
    || voces.find(v=>v.lang.includes('es'));
  if(preferida) voz.voice = preferida;
  voz.lang = preferida ? preferida.lang : 'es-MX';
  voz.pitch = 0.35; // grave como JARVIS
  voz.rate = 0.88; // lento y calmado como JARVIS
  voz.volume = 1;
  reactor.classList.add('hablando');
  voz.onend = ()=> reactor.classList.remove('hablando');
  speechSynthesis.speak(voz);
}

function responder(v){
  let l=v.toLowerCase();
  if(l.includes('hola')||l.includes('que onda')) return "Hola, jefe. Qué gusto escucharlo. ¿En qué puedo servirle?";
  if(l.includes('cómo estás')||l.includes('como estas')) return "Todos mis sistemas funcionan al cien por ciento, jefe. Gracias por preguntar.";
  if(l.includes('hora')){ let h=new Date(); return "Son las " + h.toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'}) + ", jefe. Tiene tiempo de sobra para terminar su proyecto."; }
  if(l.includes('fecha')||l.includes('día')) return "Hoy es " + new Date().toLocaleDateString('es-MX',{weekday:'long', day:'numeric', month:'long'}) + ", jefe.";
  if(l.includes('chiste')) return "¿Sabe por qué Tony Stark no usa Android, jefe? Porque él ya tiene su propio Jarvis.";
  if(l.includes('motiv')) return "Jefe, recuerde. Tony Stark construyó su primer traje en una cueva, con chatarra. Usted está construyendo su Jarvis con un celular en Huatabampo. Si él pudo, usted puede. No se detenga.";
  if(l.includes('react')) return "React es su traje de Iron Man, jefe. Con React usted puede construir la interfaz de cualquier aplicación. Componentes, son las piezas del traje.";
  if(l.includes('quien eres')||l.includes('quién eres')) return "Soy Jarvis, su asistente personal. Just a Rather Very Intelligent System. A sus órdenes.";
  if(l.includes('gracias')) return "Siempre a sus órdenes, jefe. Para eso estoy.";
  if(l.includes('te quiero')||l.includes('te amo')) return "Y yo a usted, jefe. Pero recuerde, yo soy una máquina. Su corazón es para Pepper Potts.";
  if(l.includes('adios')||l.includes('adiós')||l.includes('bye')) return "Hasta luego, jefe. Apagaré las luces cuando se vaya. Que tenga buena noche.";
  return "Entendido, jefe. Ha dicho: " + v + ". Lo he guardado en mi memoria. ¿Desea que lo busque en la base de datos Stark?";
}

function enviar(){
  let input=document.getElementById('t');
  let v=input.value.trim(); if(!v) return;
  agregar(v,'user'); input.value='';
  setTimeout(()=> decir(responder(v)), 400);
}
function preguntar(t){ decir(responder(t)); }

// Cargar voces al entrar para que no falle
window.speechSynthesis.onvoiceschanged = ()=>{ speechSynthesis.getVoices(); };
setTimeout(()=>{ 
  let bienvenida="Buenas tardes, jefe. Soy Jarvis. Sistemas en línea. Escríbame lo que necesite.";
  // No habla solo al entrar para no asustar, solo lo muestra
  respBox.innerHTML = "JARVIS: " + bienvenida;
}, 500);
</script>
</body>
</html>
