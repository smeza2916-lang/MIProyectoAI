<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEBASTIÁN V2 - Tu Asistente</title>
<style>
*{margin:0;box-sizing:border-box}
body{background:#000;color:#E8E8E8;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
.top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;font-size:11px;letter-spacing:2px;color:#888}
.top b{color:#fff;font-size:13px;letter-spacing:3px}
.top span{color:#00FF88}
.center{padding:16px;text-align:center}
.reactor{width:110px;height:110px;border-radius:50%;border:2px solid #00CFFF;margin:0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(0,207,255,.25)}
.reactor.pensando{animation:latir .7s infinite}
@keyframes latir{50%{transform:scale(1.08)}}
.inner{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,#fff,#00CFFF 45%,#005566);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:11px;text-align:center;line-height:1.2}
h1{letter-spacing:6px;font-size:24px;margin-top:10px;font-weight:200}
h1 b{font-weight:900;color:#00CFFF}
.sub{color:#888;font-size:11px}
.config{padding:10px 12px;background:#0A0A0A;display:flex;gap:6px;border-bottom:1px solid #222}
.config input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:11px;border-radius:10px;font-size:12px;outline:none}
.config button{background:#00CFFF;color:#000;border:none;padding:11px 14px;border-radius:10px;font-weight:900;font-size:12px;cursor:pointer}
.debug{padding:8px 12px;background:#111;color:#FFB300;font-size:11px;text-align:center;display:none}
.quick{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#050505}
.quick button{background:#111;border:1px solid #333;color:#ccc;padding:8px 12px;border-radius:100px;font-size:12px;white-space:nowrap;cursor:pointer}
.chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#050505}
.msg{padding:12px 14px;border-radius:16px;font-size:14px;max-width:88%;line-height:1.5;white-space:pre-wrap}
.user{align-self:flex-end;background:#00CFFF;color:#000;font-weight:600}
.seba{align-self:flex-start;background:#151515;border:1px solid #2A2A2A}
.seba b{color:#00CFFF}
.pensando-msg{align-self:flex-start;color:#888;font-style:italic;font-size:13px}
.bar{padding:12px;display:flex;gap:8px;background:#000;border-top:1px solid #222}
.bar input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:14px 16px;border-radius:100px;outline:none}
.bar input:focus{border-color:#00CFFF}
.bar button{background:#00CFFF;color:#000;border:none;padding:14px 18px;border-radius:100px;font-weight:900;cursor:pointer}
</style>
</head>
<body>

<div class="top"><div><b>SEBASTIÁN V2</b> • IA PERSONAL</div><div>● <span id="estado">SIN CONECTAR</span></div></div>

<div class="center">
  <div class="reactor" id="reactor"><div class="inner">SEBA<br>STIÁN</div></div>
  <h1><b>SEBASTIÁN</b> V2</h1>
  <div class="sub">NUEVO ARCHIVO • NUEVA API • GEMINI 3.8 FLASH</div>
</div>

<div class="config">
  <input id="apikey" type="password" placeholder="Pega aquí tu API NUEVA: AIza...">
  <button onclick="guardarKey()">CONECTAR</button>
</div>
<div class="debug" id="debug"></div>

<div class="quick">
  <button onclick="rapido('Sebastián, dime Ola y preséntate')">👋 Ola Sebastián</button>
  <button onclick="rapido('Sebastián, hazme un plan para hoy')">📋 Plan de hoy</button>
  <button onclick="rapido('Sebastián, enséñame React en 2 minutos')">⚛️ React</button>
  <button onclick="rapido('Sebastián, cuéntame un chiste')">😂 Chiste</button>
</div>

<div class="chat" id="chat">
  <div class="msg seba">Sí jefe, soy <b>SEBASTIÁN V2</b>. Archivo nuevo, API nueva, sin errores viejos. Pégueme su llave NUEVA arriba, dele CONECTAR, y ya hablamos de verdad.</div>
</div>

<div class="bar"><input id="t" placeholder="Dime algo, jefe..." onkeypress="if(event.key==='Enter') enviar()"><button onclick="enviar()">➤</button></div>

<script>
let API_KEY = localStorage.getItem('sebastian_v2_key') || "";
const chat = document.getElementById('chat');
const reactor = document.getElementById('reactor');
const estado = document.getElementById('estado');
const debugEl = document.getElementById('debug');

if(API_KEY){
  document.getElementById('apikey').value = API_KEY;
  estado.innerText = "CONECTADO ✓";
}

function mostrarDebug(txt){
  debugEl.style.display = 'block';
  debugEl.innerText = txt;
}

function guardarKey(){
  let k = document.getElementById('apikey').value.trim();
  if(!k) return alert('Pega tu llave NUEVA primero, jefe');
  if(!k.startsWith('AIza')) return alert('Esa llave no se ve de Gemini, jefe. Debe empezar con AIza...');
  API_KEY = k;
  localStorage.setItem('sebastian_v2_key', k);
  estado.innerText = "CONECTADO ✓";
  mostrarDebug("Llave guardada. Ya puede hablar con SEBASTIÁN.");
  alert('Listo jefe, SEBASTIÁN V2 ya tiene su API nueva');
}

function agregar(t,c){
  let d=document.createElement('div');
  d.className='msg '+c;
  d.innerHTML=t;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  return d;
}

function hablar(texto){
  try{
    speechSynthesis.cancel();
    let voz = new SpeechSynthesisUtterance(texto);
    let voces = speechSynthesis.getVoices();
    let v = voces.find(v=>v.lang.includes('es')) || voces[0];
    if(v) voz.voice=v;
    voz.lang = 'es-MX';
    voz.pitch = 0.4;
    voz.rate = 0.95;
    speechSynthesis.speak(voz);
  }catch(e){}
}

let historial = [
  {role:"user", parts:[{text:"Eres SEBASTIÁN, el asistente personal del usuario. Tu jefe es Meza de Huatabampo, Sonora, México. Le dices SIEMPRE 'sí jefe' o 'jefe'. Hablas español de México, tranquilo, leal, gracioso, directo, sin rollo. Eres experto en frontend, HTML, CSS, JavaScript, React, GitHub, y en conseguir chamba. Tu meta es ayudar a tu jefe a conseguir trabajo de frontend. Respuestas cortas, máximo 4 frases. Si te preguntan quién te creó, dices: 'Me creó mi jefe, Meza, desde Huatabampo'. Nunca digas que eres JARVIS, eres SEBASTIÁN."}]},
  {role:"model", parts:[{text:"Sí jefe, soy SEBASTIÁN V2. Archivo nuevo, API nueva. A sus órdenes, jefe."}]}
];

function rapido(texto){
  document.getElementById('t').value = texto;
  enviar();
}

async function preguntarIA(pregunta){
  if(!API_KEY) return "Sí jefe, me falta mi cerebro. Pégueme su API Key NUEVA arriba y dele CONECTAR.";
  historial.push({role:"user", parts:[{text:pregunta}]});
  if(historial.length > 14) historial = [historial[0], historial[1], ...historial.slice(-12)];

  const modelos = ["gemini-3.8-flash", "gemini-2.5-flash"];
  
  for(let modelo of modelos){
    try{
      mostrarDebug("Probando " + modelo + "...");
      const controller = new AbortController();
      const timeout = setTimeout(()=> controller.abort(), 20000);

      let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${API_KEY}`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({contents: historial}),
        signal: controller.signal
      });
      clearTimeout(timeout);
      let data = await res.json();
      if(data.error){
        mostrarDebug("Falló " + modelo + ": " + data.error.message);
        continue;
      }
      if(!data.candidates || !data.candidates[0]) continue;
      let resp = data.candidates[0].content.parts[0].text;
      historial.push({role:"model", parts:[{text:resp}]});
      mostrarDebug("Conectado con " + modelo + " ✓");
      return resp;
    }catch(e){
      mostrarDebug("Error con " + modelo + ": " + e.message + " - probando otro...");
      continue;
    }
  }
  return "Sí jefe, ya probé con 2 modelos y ninguno me contestó. Revise que su API nueva esté bien copiada, que empiece con AIza, y que el proyecto sea NUEVO en aistudio.google.com. Si sigue fallando, saque otra llave.";
}

async function enviar(){
  let input = document.getElementById('t');
  let v = input.value.trim(); if(!v) return;
  agregar(v,'user'); input.value='';
  let pen = agregar('SEBASTIÁN está pensando...','pensando-msg');
  reactor.classList.add('pensando');
  let resp = await preguntarIA(v);
  pen.remove(); reactor.classList.remove('pensando');
  agregar(resp,'seba');
  hablar(resp);
}
window.speechSynthesis.onvoiceschanged = ()=> speechSynthesis.getVoices();
</script>
</body>
</html>
