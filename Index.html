<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS - Mi Proyecto IA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Inter',sans-serif;height:100vh;display:flex;flex-direction:column}
.top{padding:14px 18px;display:flex;justify-content:space-between;border-bottom:1px solid #222;align-items:center}
.logo{font-family:'Orbitron';color:#FFD60A;letter-spacing:3px}
.logo span{display:block;font-size:9px;color:#888;font-family:'Inter'}
.status{font-size:11px;color:#00FF88}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.reactor{width:130px;height:130px;border-radius:50%;border:3px solid #FFD60A;display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px rgba(255,214,10,.5)}
.inner{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#fff,#FFD60A 50%,#FF8C00);display:flex;align-items:center;justify-content:center;color:#000;font-family:'Orbitron';font-size:10px;font-weight:700;text-align:center}
h1{font-family:'Orbitron';color:#FFD60A;letter-spacing:4px;margin-top:20px;font-size:24px}
h1 small{display:block;color:#888;font-size:11px;letter-spacing:2px;font-family:'Inter';margin-top:6px}
.chat{height:260px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#0a0a0a;border-top:1px solid #222}
.msg{max-width:85%;padding:12px;border-radius:14px;font-size:14px;line-height:1.4}
.user{align-self:flex-end;background:#FFD60A;color:#000;font-weight:600}
.jarvis{align-self:flex-start;background:#151515;border:1px solid #333}
.jarvis b{color:#FFD60A}
.bar{padding:12px;display:flex;gap:8px;background:#050505}
input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:13px;border-radius:100px;outline:none}
button{background:#FFD60A;border:none;padding:13px 18px;border-radius:100px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="top"><div class="logo">J.A.R.V.I.S<span>JUST A RATHER VERY INTELLIGENT SYSTEM</span></div><div class="status">● EN LÍNEA</div></div>
<div class="center" id="inicio"><div class="reactor"><div class="inner">JARVIS<br>ONLINE</div></div><h1>J.A.R.V.I.S<small>BIENVENIDO, JEFE. ¿EN QUÉ LE AYUDO?</small></h1></div>
<div class="chat" id="chat"><div class="msg jarvis">Hola jefe, soy <b>JARVIS</b>. Sistemas al 100%. Pregúntame algo.</div></div>
<div class="bar"><input id="input" placeholder="Háblale a JARVIS..." onkeypress="if(event.key==='Enter') enviar()"><button onclick="enviar()">ENVIAR</button></div>
<script>
const chat=document.getElementById('chat');const input=document.getElementById('input');
function agregar(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerHTML=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;document.getElementById('inicio').style.display='none';}
function responder(p){p=p.toLowerCase();let r="";if(p.includes('hola'))r="Hola jefe. Qué bueno verlo. ¿Listo para conquistar el mundo como Stark?";else if(p.includes('chiste'))r="¿Por qué Tony Stark no usa Android? Porque él ya tiene su propio JARVIS 😎";else if(p.includes('react'))r="React es su traje de Iron Man, jefe. Con React usted hace el Front End de todo.";else if(p.includes('motiv'))r="Tony hizo su traje en una cueva con chatarra. Usted está haciendo su JARVIS en Huatabampo con un celular. Si él pudo, usted puede.";else r="Entendido jefe. Guardé: <b>"+p+"</b>. ¿Qué más necesita?";setTimeout(()=>agregar(r,'jarvis'),500);}
function enviar(){let t=input.value.trim();if(!t)return;agregar(t,'user');input.value='';responder(t);}
</script>
</body>
  </html>
